repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.patch$
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: validate-examples
        name: Validate examples and workflow permissions
        entry: python scripts/validate_examples.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        always_run: true
      - id: lock-check
        name: Check dependency lock
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject.toml|uv.lock)$
