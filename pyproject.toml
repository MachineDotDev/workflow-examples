[project]
name = "machine-workflow-examples"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
vision = ["torch==2.14.1", "torchvision==0.29.1", "transformers==5.23.0", "timm==1.0.31", "pillow==13.0.0"]
training = ["torch==2.14.1", "transformers==5.23.0", "peft==0.22.0", "trl==1.18.2", "datasets==5.2.0", "accelerate==1.16.0"]
evaluation = ["torch==2.14.1", "transformers==5.23.0", "datasets==5.2.0"]

[dependency-groups]
dev = ["ruff", "pyyaml", "pre-commit"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
