name: Semantic PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  semantic-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! [[ "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test|ci|perf|build|revert)(\([a-zA-Z0-9_-]+\))?\!?:\ .+ ]]; then
            echo 'Use a conventional title, such as fix: restore training checkpoints'
            exit 1
          fi
