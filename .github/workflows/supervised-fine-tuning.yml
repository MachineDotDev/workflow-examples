name: Supervised fine-tuning
on:
  workflow_dispatch:
    inputs:
      resume:
        description: Verify checkpoint resume after two training steps
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: gpu-examples
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gpu
    runs-on: machine/id=${{ github.run_id }}-${{ github.run_attempt }}-sft/gpu=t4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Verify CUDA
        run: nvidia-smi
      - name: Run workload
        run: uv run --locked --no-dev --extra training python supervised-fine-tuning/run.py --output outputs/sft
      - name: Resume checkpoint in a new Python process
        if: inputs.resume
        run: uv run --locked --no-dev --extra training python supervised-fine-tuning/run.py --steps 3 --resume outputs/sft/checkpoint-2 --output outputs/sft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sft-${{ github.run_attempt }}
          path: outputs/sft/
          if-no-files-found: error
          retention-days: 7
