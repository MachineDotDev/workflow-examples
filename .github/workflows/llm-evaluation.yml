name: LLM evaluation gate
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Branch or tag with the baseline answerer
        required: true
        default: main
        type: string
      defect:
        description: Apply a deliberate defect to the candidate to check the gate rejects it
        required: true
        default: none
        type: choice
        options:
          - none
          - truncated-question
permissions:
  contents: read
concurrency:
  group: gpu-examples
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gpu
    runs-on: machine/id=${{ github.run_id }}-${{ github.run_attempt }}-evaluation/gpu=t4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the baseline is a branch or tag here
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          case "$BASELINE_REF" in refs/*) echo "Give a branch or tag name, not $BASELINE_REF"; exit 1;; esac
          git ls-remote --exit-code "$REPO_URL" "refs/heads/$BASELINE_REF" "refs/tags/$BASELINE_REF" >/dev/null ||
            { echo "$BASELINE_REF isn't a branch or tag in this repository"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Record versions
        run: |
          nvidia-smi
          echo "candidate=$(git rev-parse HEAD) baseline=$(git -C baseline rev-parse HEAD) defect=${DEFECT}"
        env:
          DEFECT: ${{ inputs.defect }}
      - name: Apply deliberate defect
        if: inputs.defect != 'none'
        run: git apply "llm-evaluation/defects/${DEFECT}.patch"
        env:
          DEFECT: ${{ inputs.defect }}
      - name: Compare candidate with baseline
        run: >-
          uv run --locked --no-dev --extra evaluation python llm-evaluation/run.py
          --baseline baseline/llm-evaluation --output outputs/evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-${{ github.run_attempt }}
          path: outputs/evaluation/
          if-no-files-found: error
          retention-days: 7
