name: Parallel hyperparameter tuning
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-examples
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gpu
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        learning-rate: ['0.001', '0.0001']
        batch-size: [8, 16]
    runs-on: machine/id=${{ github.run_id }}-${{ github.run_attempt }}-tuning-${{ matrix.learning-rate }}-${{ matrix.batch-size }}/gpu=t4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Verify CUDA
        run: nvidia-smi
      - name: Run workload
        env:
          LEARNING_RATE: ${{ matrix.learning-rate }}
          BATCH_SIZE: ${{ matrix.batch-size }}
        run: uv run --locked --no-dev --extra vision python parallel-hyperparameter-tuning/run.py --output outputs/tuning --learning-rate "$LEARNING_RATE" --batch-size "$BATCH_SIZE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tuning-${{ matrix.learning-rate }}-${{ matrix.batch-size }}-${{ github.run_attempt }}
          path: outputs/tuning/
          if-no-files-found: error
          retention-days: 7
