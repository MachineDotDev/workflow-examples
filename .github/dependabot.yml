version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Installed from the PyTorch CUDA index, which Dependabot can't resolve.
      - dependency-name: torch
      - dependency-name: torchvision
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ['*']
